name: CI

# Integration: the same gates as `task check`, split into jobs so failures are easy to read. It
# holds no deploy secrets; delivery is cd.yml, called at the end with the build that passed.
#   quality → format, lint (typecheck, token and architecture checks) and unit tests
#   build   → production build with budgets; its dist/ is what any deploy publishes
#   e2e     → Playwright against that very build (Chromium desktop and Pixel 7, Firefox, WebKit)
#   cd      → only after everything passes: a pr-N preview with its own API for a (non-draft) PR;
#             pre for a merge to main, then production when main carries a version not yet tagged
#             (a release PR from `task release:*`). Tags are created by CD, never pushed by hand.
#             No host builds on its own, so nothing reaches production without this.
# A PR stacked on another branch (its base is not main) runs quality only: build, e2e and its
# preview wait until it targets main. Retargeting it to main (an `edited` event that changes the
# base, as GitHub does when the PR below merges) runs everything; other edits run nothing.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR replaces its run; runs on main queue, so a deploy to pre or production is
# never cut short. An edit that leaves the base alone (title, body) gets a group of its own, so it
# never cancels a run in progress.
concurrency:
  group: ci-${{ github.ref }}${{ github.event.action == 'edited' && !github.event.changes.base && '-edit' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Format, lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Every run that runs at all: a push to main, or a ready PR opened, pushed to, reopened or
    # retargeted (a title or body edit runs nothing).
    if: >-
      (github.event_name == 'push' || (!github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.base != null)))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0
      - run: task setup
      - run: task fmt-check
      - run: task lint
      - run: task unit

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # As quality, but only for main or a PR into main: a stacked PR waits until it targets main.
    if: >-
      (github.event_name == 'push' || (!github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.base != null))) && (github.event_name == 'push' || github.event.pull_request.base.ref == 'main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/super-tic-tac-toe/browser/
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    # Playwright's own image: its browsers and their system libraries come installed, so nothing
    # waits on apt (an install from a slow mirror once ate the whole timeout). The tag follows the
    # locked @playwright/test version (package.json), as `task e2e:webkit` does; a mismatch fails
    # at once with Playwright's "Executable doesn't exist".
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/super-tic-tac-toe/browser/
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  cd:
    name: CD
    needs: [quality, build, e2e]
    # A (non-draft) PR gets its preview; a merge to main goes to pre, and on to production when it
    # carries a new version.
    if: >-
      github.event_name == 'push' || !github.event.pull_request.draft
    permissions:
      contents: write
      actions: read
      pull-requests: write
    uses: ./.github/workflows/cd.yml
    with:
      environment: ${{ github.event_name == 'pull_request' && 'preview' || 'pre' }}
      pr-number: ${{ github.event.pull_request.number || 0 }}
      # The branch's own commit, not the temporary merge commit GitHub tests on a PR.
      head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      message: ${{ github.event_name == 'pull_request' && format('PR {0}', github.event.pull_request.number) || format('main {0}', github.sha) }}
    secrets: inherit
