name: Deploy the API

# Publishes the API Worker (packages/api) with its GameRoom Durable Object, before the app whose
# service binding needs it. It has no public address: the app's deploy then checks /api/health
# through the binding. Without the secrets (forks, Dependabot) it skips quietly.
#   preview    → super-3t-api-pr-N (`--env preview --name`), deleted when the PR closes
#   pre        → super-3t-api-pre (`--env pre`)
#   production → super-3t-api (the top level)
on:
  workflow_call:
    inputs:
      environment:
        description: preview, pre or production
        type: string
        required: true
      worker:
        description: The API Worker's name
        type: string
        required: true
      message:
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.worker }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One deploy of a Worker at a time, each run to the end.
    concurrency:
      group: deploy-api-${{ inputs.worker }}
      cancel-in-progress: false
    environment:
      name: api-${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      ENVIRONMENT: ${{ inputs.environment }}
      WORKER: ${{ inputs.worker }}
      MESSAGE: ${{ inputs.message }}
    steps:
      - name: Check credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare secrets not available for this run; skipping deploy."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      # The Worker is bundled from source (Hono, the engines through @catalog): the locked
      # dependencies, with wrangler at the version the API pins.
      - run: npm ci
        if: steps.creds.outputs.ok == 'true'
      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        working-directory: packages/api
        run: |
          case "$ENVIRONMENT" in
            production) target=(--env=""); [ "$WORKER" = super-3t-api ] ;;
            pre) target=(--env pre); [ "$WORKER" = super-3t-api-pre ] ;;
            preview) target=(--env preview --name "$WORKER"); [[ "$WORKER" =~ ^super-3t-api-pr-[0-9]+$ ]] ;;
            *) false ;;
          esac || { echo "::error::$WORKER is not the API of $ENVIRONMENT."; exit 1; }
          npx wrangler deploy "${target[@]}" --message "$MESSAGE"
          echo "Deployed $WORKER" >> "$GITHUB_STEP_SUMMARY"
