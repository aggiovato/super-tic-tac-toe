name: Cleanup

# A closed (or merged) PR's own API Worker, super-3t-api-pr-N, is deleted with its rooms. Its app
# version stays in Cloudflare's history but nothing serves it.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  api:
    name: Delete the PR's API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      WORKER: super-3t-api-pr-${{ github.event.pull_request.number }}
    steps:
      - name: Delete
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not available; nothing to delete."; exit 0
          fi
          # A PR that never deployed (a draft, a fork) has no Worker: that is not a failure.
          if npx -y wrangler@4.158.0 delete --name "$WORKER" --force 2>&1 | tee delete.log; then
            echo "Deleted $WORKER" >> "$GITHUB_STEP_SUMMARY"
          elif grep -qiE 'not found|does not exist|10007' delete.log; then
            echo "::notice::$WORKER does not exist."
          else
            exit 1
          fi
