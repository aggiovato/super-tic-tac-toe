name: Deploy the app

# Publishes the app's tested build (the `dist` artifact of a CI run) to one host:
#   cloudflare → static assets plus the edge Worker for /api (wrangler.jsonc). Production replaces
#                the live version, bound to super-3t-api. A preview (alias pr-N) or pre (alias pre)
#                uploads a version served only at its alias, bound to its own API with a config
#                written by scripts/wrangler-config.mjs. Then /api/health must answer through it.
#   netlify    → the backup host, with its own SPA fallback (_redirects); it has no /api.
# A PR's preview is linked in the PR. Without the host's secrets (forks, Dependabot) it skips.
on:
  workflow_call:
    inputs:
      host:
        description: cloudflare or netlify
        type: string
        required: true
      environment:
        description: preview, pre or production
        type: string
        required: true
      alias:
        description: The version's alias (pr-N, pre); empty for production
        type: string
        default: ''
      api-worker:
        description: The API Worker the version is bound to (Cloudflare)
        type: string
        required: true
      pr-number:
        type: number
        default: 0
      head-sha:
        type: string
        required: true
      message:
        type: string
        required: true
      run-id:
        description: The CI run that built and tested the artifact
        type: string
        required: true
    outputs:
      url:
        description: Where this version is served
        value: ${{ jobs.deploy.outputs.url }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy (${{ inputs.host }}, ${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    # A preview may be replaced by a newer push; pre and production always run to the end.
    concurrency:
      group: deploy-${{ inputs.host }}-${{ inputs.environment }}-${{ inputs.pr-number }}
      cancel-in-progress: ${{ inputs.environment == 'preview' }}
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      HOST: ${{ inputs.host }}
      ENVIRONMENT: ${{ inputs.environment }}
      ALIAS: ${{ inputs.alias }}
      API_WORKER: ${{ inputs.api-worker }}
      PR_NUMBER: ${{ inputs.pr-number }}
      MESSAGE: ${{ inputs.message }}
      DIST: dist/super-tic-tac-toe/browser
      CLOUDFLARE_API_TOKEN: ${{ inputs.host == 'cloudflare' && secrets.CLOUDFLARE_API_TOKEN || '' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ inputs.host == 'cloudflare' && secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
      NETLIFY_AUTH_TOKEN: ${{ inputs.host == 'netlify' && secrets.NETLIFY_AUTH_TOKEN || '' }}
      NETLIFY_SITE_ID: ${{ inputs.host == 'netlify' && secrets.NETLIFY_SITE_ID || '' }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check credentials
        id: creds
        run: |
          case "$HOST" in
            cloudflare) [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && ok=true ;;
            netlify) [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ] && ok=true ;;
            *) echo "::error::Unknown host $HOST."; exit 1 ;;
          esac
          if [ "${ok:-}" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$HOST secrets not available for this run; skipping deploy."
          fi
      # Only the configs, the edge Worker and the config writer are needed; checkout runs first
      # because it cleans the workspace.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.creds.outputs.ok == 'true'
        with:
          sparse-checkout: |
            .nvmrc
            wrangler.jsonc
            edge/
            scripts/wrangler-config.mjs
          sparse-checkout-cone-mode: false
      # The very build the e2e job tested, where wrangler.jsonc expects it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.creds.outputs.ok == 'true'
        with:
          name: dist
          path: ${{ env.DIST }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version-file: .nvmrc
      - name: Deploy
        id: deploy
        if: steps.creds.outputs.ok == 'true'
        run: |
          if [ "$HOST" = "cloudflare" ]; then
            wrangler=(npx -y wrangler@4.158.0)
            if [ "$ENVIRONMENT" = "production" ]; then
              "${wrangler[@]}" deploy --env="" --message "$MESSAGE" | tee deploy.log
              url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
            else
              node scripts/wrangler-config.mjs "$API_WORKER" wrangler.generated.json
              "${wrangler[@]}" versions upload -c wrangler.generated.json --preview-alias "$ALIAS" \
                --message "$MESSAGE" | tee deploy.log
              url=$(grep -oE "https://$ALIAS-[a-z0-9.-]+\.workers\.dev" deploy.log | head -1)
            fi
          else
            # Cloudflare routes unknown paths to the app by itself (wrangler.jsonc); Netlify
            # needs the rule in the build output.
            printf '/*  /index.html  200\n' > "$DIST/_redirects"
            if [ "$ENVIRONMENT" = "production" ]; then target=(--prod); else target=(--alias "$ALIAS"); fi
            npx -y netlify-cli@27.20.0 deploy --dir "$DIST" --site "$NETLIFY_SITE_ID" --no-build \
              "${target[@]}" --message "$MESSAGE" --json > deploy.json
            url=$(node -e "const d=require('./deploy.json'); console.log(process.env.ENVIRONMENT==='production' ? d.url : d.deploy_url)")
          fi
          if [ -z "$url" ]; then
            echo "::error::No URL in the $HOST deploy's output."; exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed ($HOST, $ENVIRONMENT): $url" >> "$GITHUB_STEP_SUMMARY"
      # The app reaches its API through the binding: online play works on this version.
      - name: Check the API through the app
        if: steps.creds.outputs.ok == 'true' && inputs.host == 'cloudflare'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for _ in 1 2 3 4 5 6; do
            if [ "$(curl -fsS "$URL/api/health" || true)" = "ok" ]; then
              echo "API reachable through $URL/api" >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            sleep 5
          done
          echo "::error::$URL/api/health did not answer ok."; exit 1
      - name: Link the preview in the PR
        if: steps.creds.outputs.ok == 'true' && inputs.environment == 'preview' && inputs.pr-number > 0
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          HEAD_SHA: ${{ inputs.head-sha }}
        run: |
          # Cloudflare keeps one comment up to date (its alias URL is stable); Netlify's URL
          # changes per deploy, so each gets its own.
          if [ "$HOST" = "cloudflare" ]; then
            body="Preview (Cloudflare, with its own API $API_WORKER): $URL (commit ${HEAD_SHA::7}, after quality, build and e2e passed)"
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --body "$body" \
              || gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            body="Preview (Netlify, no online play): $URL (commit ${HEAD_SHA::7}, after quality, build and e2e passed)"
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
