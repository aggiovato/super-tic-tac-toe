        <path d="M-6.5 -9 H6 L-0.5 -1.5 C5 -1.5 7.5 1.5 7.5 4.8 C7.5 8.6 4.5 10.5 0.5 10.5 C-2.6 10.5 -5.2 9.4 -6.8 7.2" transform="scale(0.92)" fill="none" stroke="#dce6e1" stroke-width="3.6"
          stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="-13" y="-0.35" width="26" height="0.7" fill="#050b0c" opacity=".85"/>
      </g>
