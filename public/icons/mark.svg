    </filter>
    <mask id="ink"><path d="M31 31 H77 M54 31 V77" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/></mask>
    <clipPath id="small"><rect x="-13" y="-15" width="26" height="30" rx="4.5"/></clipPath>
