<div
  class="platform"
  [class.closed]="store.isOver()"
  [class.won]="won()"
  [class.celebrate]="celebrate()"
>
  <div
    #grid
    class="cells"
    role="group"
    [attr.aria-label]="t().classic.board"
    (keydown)="onKey($event, grid)"
  >
    @for (cell of cells(); track cell.cell) {
      <button
        type="button"
        [app-board-cell]="cell"
        [attr.data-roving]="cell.cell"
        [attr.tabindex]="cell.cell === roving() ? 0 : -1"
        [attr.aria-disabled]="!cell.legal"
        [attr.aria-label]="cell.label"
        (click)="play(cell.cell)"
      ></button>
    }
    @if (strike(); as line) {
      <app-strike-line [segment]="line" [animate]="true" />
    }
    @if (closing(); as mark) {
      <app-closing-mark [mark]="mark" [animate]="fresh()" />
    }
  </div>
</div>
