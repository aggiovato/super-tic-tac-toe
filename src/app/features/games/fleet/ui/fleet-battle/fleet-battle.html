@if (store.lookingAtOwn()) {
  <!-- Through the magnifier: the big board says whose waters it shows, and the way back. -->
  <div class="looking">
    <h2>{{ t().fleet.yourWaters }}</h2>
    <button app-button="quiet" class="back" (click)="store.look(false)">
      {{ t().fleet.lookAtRival }}
    </button>
  </div>
} @else {
  <app-fleet-quay part="rival" class="stacked" />
}

@if (store.lookingAtOwn()) {
  <app-fleet-waters
    class="board"
    [cells]="views().own.cells"
    [ships]="views().own.ships"
    [wrecks]="views().own.wrecks"
    [won]="views().own.won"
    [celebrate]="views().own.celebrate"
    [platform]="true"
    [label]="t().fleet.yourWaters"
  />
} @else {
  <app-fleet-waters
    class="board"
    [cells]="views().enemy.cells"
    [ships]="views().enemy.ships"
    [wrecks]="views().enemy.wrecks"
    [won]="views().enemy.won"
    [celebrate]="views().enemy.celebrate"
    [aimed]="store.aimed()"
    [interactive]="true"
    [platform]="true"
    [label]="t().fleet.rivalWaters"
    (picked)="pick($event)"
    (focused)="focus($event)"
  />
}

<!-- Wide screens: the one primary action right under the board, Fire then Rematch. -->
<div class="act">
  @if (store.isOver()) {
    <button app-button="primary" (click)="store.rematch()">{{ t().rematch }}</button>
  } @else {
    <button app-button="primary" [disabled]="store.aimed() === null" (click)="store.fire()">
      {{ t().fleet.fire }}
    </button>
  }
</div>

<app-fleet-quay part="own" class="stacked" />
