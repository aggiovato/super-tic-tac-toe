<app-fleet-how-to-play />
<app-game-layout [arenaLabel]="t().boardLabel">
  <app-brand-title masthead />
  <div masthead class="flex items-center gap-1">
    <app-games-menu />
    <app-history-link />
    <app-settings-sheet>
      <app-fleet-settings (howToPlay)="howToPlay().open()" />
    </app-settings-sheet>
  </div>
  <app-fleet-status status />
  @if (placing()) {
    <app-fleet-placement arena />
  } @else {
    <app-fleet-battle arena />
  }
  @if (!placing()) {
    <app-fleet-quay controls part="both" class="side" />
  }
  <app-score-board controls [compact]="true" />
  <app-game-actions controls />
  <app-save-notice controls />
</app-game-layout>
