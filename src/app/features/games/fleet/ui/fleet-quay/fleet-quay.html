<ng-template #rivalRow>
  <section class="fleet" [attr.aria-label]="t().fleet.rivalFleet">
    <div class="heading">
      <h2>{{ owners().rival }}</h2>
      <span class="afloat">{{ t().fleet.afloat(views().enemy.afloat) }}</span>
    </div>
    <app-fleet-trains [ships]="views().enemy.trains" [label]="t().fleet.rivalFleet" />
  </section>
</ng-template>

<ng-template #ownRow>
  <section class="fleet" [attr.aria-label]="t().fleet.yourFleet">
    <div class="heading">
      <h2>{{ owners().own }}</h2>
      <span class="afloat">{{ t().fleet.afloat(views().own.afloat) }}</span>
    </div>
    <app-fleet-trains [ships]="views().own.trains" [own]="true" [label]="t().fleet.yourFleet" />
  </section>
</ng-template>

<!-- The magnifier: the thumbnail shows the board not on the big one; a tap swaps them. -->
<ng-template #ownWaters>
  <button
    type="button"
    class="lens"
    [attr.aria-pressed]="store.lookingAtOwn()"
    [attr.aria-label]="store.lookingAtOwn() ? t().fleet.lookAtRival : t().fleet.lookAtOwn"
    (click)="store.look(!store.lookingAtOwn())"
  >
    <app-fleet-waters
      class="mini"
      [cells]="thumbnail().cells"
      [ships]="thumbnail().ships"
      [wrecks]="thumbnail().wrecks"
      [compact]="true"
      [label]="''"
    />
    <span class="badge"><app-icon name="zoom" /></span>
  </button>
</ng-template>

@switch (part()) {
  @case ('rival') {
    <ng-container *ngTemplateOutlet="rivalRow" />
  }
  @case ('own') {
    <div class="quay">
      <ng-container *ngTemplateOutlet="ownWaters" />
      <ng-container *ngTemplateOutlet="ownRow" />
      <!-- One primary action in one place: Fire while the game goes on, Rematch once it ends. -->
      @if (store.isOver()) {
        <button app-button="primary" (click)="store.rematch()">{{ t().rematch }}</button>
      } @else {
        <button app-button="primary" [disabled]="store.aimed() === null" (click)="store.fire()">
          {{ t().fleet.fire }}
        </button>
      }
    </div>
  }
  @default {
    <ng-container *ngTemplateOutlet="rivalRow" />
    <ng-container *ngTemplateOutlet="ownRow" />
    <figure class="waters">
      <figcaption>
        {{ store.lookingAtOwn() ? t().fleet.rivalWaters : t().fleet.yourWaters }}
      </figcaption>
      <ng-container *ngTemplateOutlet="ownWaters" />
    </figure>
  }
}
