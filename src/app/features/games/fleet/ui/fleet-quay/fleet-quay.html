@if (part() !== 'own') {
  <section class="rival" [attr.aria-label]="t().fleet.rivalFleet">
    <div class="heading">
      <h2>{{ t().fleet.rivalFleet }}</h2>
      <span class="afloat">{{ t().fleet.afloat(views().enemy.afloat) }}</span>
    </div>
    <app-fleet-trains [ships]="views().enemy.trains" [label]="t().fleet.rivalFleet" />
  </section>
}
@if (part() !== 'rival') {
  <section class="quay" [attr.aria-label]="t().fleet.yourFleet">
    <app-fleet-waters
      class="mini"
      [cells]="views().own.cells"
      [ships]="views().own.ships"
      [wrecks]="views().own.wrecks"
      [compact]="true"
      [label]="t().fleet.yourWaters"
    />
    <div class="own">
      <h2>{{ t().fleet.yourFleet }}</h2>
      <app-fleet-trains [ships]="views().own.trains" [own]="true" [label]="t().fleet.yourFleet" />
    </div>
    <button
      app-button="primary"
      class="fire"
      [disabled]="store.aimed() === null"
      (click)="store.fire()"
    >
      {{ t().fleet.fire }}
    </button>
  </section>
}
