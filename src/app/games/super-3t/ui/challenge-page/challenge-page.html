<app-game-layout [arenaLabel]="t().boardLabel">
  <app-brand-title masthead [wonBoards]="wonBoards()" />
  <button masthead app-button="quiet" size="small" (click)="exit()">
    <app-icon name="close" />
    {{ t().challenge.exit }}
  </button>
  <app-departure-panel status />
  <app-super3t-board arena />
  <h2 controls class="sr-only">{{ t().challenge.title }}</h2>
  <app-challenge-panel controls />
</app-game-layout>
