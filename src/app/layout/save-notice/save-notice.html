<div class="notice" [class.problem]="problem()">
  <!-- Only a failure shows: a routine save is silent, as every game is kept on this device. -->
  <span aria-live="polite">{{ problem() }}</span>
  @if (problem()) {
    @if (retryable()) {
      <button app-button="secondary" size="small" (click)="match.retrySave()">
        {{ t().save.retry }}
      </button>
    } @else if (match.saveStatus() === 'conflict') {
      <button app-button="secondary" size="small" (click)="reload()">{{ t().save.reload }}</button>
    }
  }
</div>
