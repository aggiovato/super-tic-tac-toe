<!-- Online a move sent is the other player's to see, and hidden information would be peeked at. -->
@if (undoable()) {
  <button app-button="secondary" [disabled]="!store.canUndo()" (click)="store.undo()">
    <app-icon name="undo" />
    {{ t().undo }}
  </button>
}
@if (store.isOver()) {
  <button app-button="primary" (click)="store.rematch()">{{ t().rematch }}</button>
}
