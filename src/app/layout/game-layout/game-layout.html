<app-backdrop />
<div class="game">
  <header class="masthead">
    <ng-content select="app-brand-title" />
    <!-- Online, the room's button before the page's own masthead actions; nothing on a local game. -->
    <div class="masthead-end">
      <app-online-room-button />
      <ng-content select="[masthead]" />
    </div>
  </header>
  <div class="departures"><ng-content select="[status]" /></div>
  <section class="arena" [attr.aria-label]="arenaLabel()"><ng-content select="[arena]" /></section>
  <footer class="controls">
    <ng-content select="[controls]" />
    <!-- Online, the room's panel only while something needs saying (the masthead button has it all). -->
    <app-online-panel when="needed" />
    <!-- A new version, offered in the flow under the save notice: never over the controls. -->
    <app-update-notice />
  </footer>
  <!-- The family of games, on the left on wide screens (the games menu elsewhere); it folds away. -->
  <aside class="library" [class.folded]="!shown()" aria-labelledby="library-title">
    <div class="library-head">
      <h2 id="library-title" class="library-title">{{ t().library.title }}</h2>
      <button
        app-button="quiet"
        size="small"
        aria-controls="library-games"
        [attr.aria-expanded]="shown()"
        [attr.aria-label]="shown() ? t().library.hide : t().library.show"
        (click)="toggle()"
      >
        <app-icon [name]="shown() ? 'fold' : 'games'" />
      </button>
    </div>
    <app-game-library id="library-games" [attr.inert]="shown() ? null : ''" />
  </aside>
</div>
<!-- What opens over the game on its own route (the history ticket), the game kept under it. -->
<router-outlet />
