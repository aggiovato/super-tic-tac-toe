<button app-button="quiet" size="small" popovertarget="settings-panel">
  <app-icon name="settings" />
  {{ t().settings.open }}
</button>

<div id="settings-panel" class="sheet" popover aria-labelledby="settings-title">
  <header class="sheet-head">
    <h2 id="settings-title" class="text-title font-semibold text-fg-strong">
      {{ t().settings.title }}
    </h2>
    <button
      app-button="quiet"
      popovertarget="settings-panel"
      popovertargetaction="hide"
      [attr.aria-label]="t().settings.close"
    >
      <app-icon name="close" />
    </button>
  </header>

  <fieldset>
    <legend>{{ t().settings.players }}</legend>
    @for (index of [0, 1]; track index) {
      <label class="field">
        <span>{{ t().settings.playerName(index + 1) }}</span>
        <input
          type="text"
          autocomplete="off"
          [maxLength]="nameMaxLength"
          [placeholder]="t().defaultName(index + 1)"
          [value]="preferences.names()[index]"
          (input)="onName(index === 0 ? 0 : 1, $event)"
        />
      </label>
    }
  </fieldset>

  <app-choice-group
    name="language"
    [legend]="t().settings.language"
    [options]="languageOptions()"
    [selected]="translator.lang()"
    (chosen)="translator.setLang($event)"
  />

  <app-choice-group
    name="motion"
    [legend]="t().settings.motion"
    [options]="motionOptions()"
    [selected]="preferences.motion()"
    (chosen)="preferences.setMotion($event)"
  />

  <app-choice-group
    name="design"
    [legend]="t().settings.design"
    [options]="designOptions()"
    [selected]="preferences.design()"
    (chosen)="preferences.setDesign($event)"
  />

  <div class="toggles">
    <app-choice
      [checked]="preferences.autoZoom()"
      [hint]="t().settings.autoZoomHint"
      (changed)="preferences.setAutoZoom(!preferences.autoZoom())"
    >
      {{ t().settings.autoZoom }}
    </app-choice>
    <app-choice
      [checked]="preferences.hints()"
      [hint]="t().settings.hintsHint"
      (changed)="preferences.setHints(!preferences.hints())"
    >
      {{ t().settings.hints }}
    </app-choice>
  </div>

  <button
    [app-button]="confirmingReset() ? 'primary' : 'secondary'"
    class="w-full"
    (click)="newSeries()"
  >
    {{ confirmingReset() ? t().settings.confirmNewSeries : t().settings.newSeries }}
  </button>
</div>
