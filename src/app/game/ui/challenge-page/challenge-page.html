<app-backdrop />
<div class="game">
  <header class="masthead">
    <app-brand-title />
    <button app-button="quiet" size="small" (click)="exit()">
      <app-icon name="close" />
      {{ t().challenge.exit }}
    </button>
  </header>

  <app-departure-panel class="departures" />

  <section class="arena" [attr.aria-label]="t().boardLabel">
    <app-game-board />
  </section>

  <footer class="controls">
    <h2 class="sr-only">{{ t().challenge.title }}</h2>
    <app-challenge-panel />
  </footer>
</div>
