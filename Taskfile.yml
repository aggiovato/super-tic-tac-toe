version: '3'

# Each entry lands with the npm script it calls. e2e arrives in phase 2 with Playwright.
tasks:
  setup:
    desc: Install locked dependencies
    cmds: [npm ci]
  dev:
    desc: Development server
    cmds: [npm start]
  lint:
    desc: ESLint with zero warnings
    cmds: [npm run lint]
  fmt:
    desc: Format with Prettier
    cmds: [npm run format]
  fmt-check:
    desc: Check formatting
    cmds: [npm run format:check]
  unit:
    desc: Engine (Node) and app (Angular) tests
    cmds:
      - npm run test:core
      - npm run test:app
  build:
    desc: Production build with budgets
    cmds: [npm run build]
  check:
    desc: Full verification, same as CI
    cmds:
      - task: fmt-check
      - task: lint
      - task: unit
      - task: build
  ci:
    desc: Clean install and full verification
    cmds:
      - task: setup
      - task: check
