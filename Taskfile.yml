version: '3'

# Each entry lands with the npm script it calls.
tasks:
  setup:
    desc: Install locked dependencies
    cmds: [npm ci]
  dev:
    desc: Development server
    cmds: [npm start]
  lint:
    desc: ESLint with zero warnings
    cmds: [npm run lint]
  fmt:
    desc: Format with Prettier
    cmds: [npm run format]
  fmt-check:
    desc: Check formatting
    cmds: [npm run format:check]
  unit:
    desc: Engine (Node) and app (Angular) tests
    cmds:
      - npm run test:core
      - npm run test:app
  build:
    desc: Production build with budgets
    run: once
    cmds: [npm run build]
  e2e:
    desc: Playwright against the production build (needs `npx playwright install chromium` once)
    cmds:
      - task: build
      - npm run test:e2e
  check:
    desc: Full verification, same as CI
    cmds:
      - task: fmt-check
      - task: lint
      - task: unit
      - task: e2e
  # Releases: run on an up-to-date, clean main. `npm version` bumps package.json, commits
  # "chore(release): vX.Y.Z" and tags it; `git push --follow-tags` then lets CI run the whole
  # pipeline and deploy that tag to production.
  release:guard:
    internal: true
    cmds:
      - test "$(git branch --show-current)" = main || (echo "Release from main only." && exit 1)
      - test -z "$(git status --porcelain)" || (echo "Working tree not clean." && exit 1)
      - git fetch -q origin main
      - test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || (echo "main is not up to date with origin." && exit 1)
  release:patch:
    desc: Release a patch version (fixes)
    cmds:
      - task: release:guard
      - 'npm version patch -m "chore(release): v%s"'
  release:minor:
    desc: Release a minor version (new features)
    cmds:
      - task: release:guard
      - 'npm version minor -m "chore(release): v%s"'
  release:major:
    desc: Release a major version
    cmds:
      - task: release:guard
      - 'npm version major -m "chore(release): v%s"'
  ci:
    desc: Clean install and full verification
    cmds:
      - task: setup
      - task: check
