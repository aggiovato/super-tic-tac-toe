version: '3'

# Each entry lands with the npm script it calls.
tasks:
  setup:
    desc: Install locked dependencies
    cmds: [npm ci]
  dev:
    desc: Development server
    cmds: [npm start]
  lint:
    desc: ESLint with zero warnings
    cmds: [npm run lint]
  fmt:
    desc: Format with Prettier
    cmds: [npm run format]
  fmt-check:
    desc: Check formatting
    cmds: [npm run format:check]
  unit:
    desc: Engine (Node), app (Angular) and API (Workers runtime) tests
    cmds:
      - npm run test:core
      - npm run test:app
      - npm run test:api
  api:dev:
    desc: The API Worker locally on port 8787 (wrangler dev); `task dev` proxies /api to it
    cmds:
      - npm run dev --workspace @super-3t/api
  build:
    desc: Production build with budgets
    run: once
    cmds: [npm run build]
  serve:cf:
    desc: Build, then serve it as Cloudflare does on http://localhost:8790 (headers, SPA routing, /api through the binding to the API Worker)
    cmds:
      - task: build
      - npm run serve:cf -- {{.CLI_ARGS}}
  e2e:
    desc: Playwright against the production build, Chromium and Firefox (needs `npx playwright install chromium firefox` once)
    cmds:
      - task: build
      - npm run test:e2e
  e2e:webkit:
    desc: Build, then the flows in WebKit inside Playwright's container (Podman; WebKit needs Ubuntu's libraries)
    cmds:
      - task: build
      - podman run --rm --ipc=host -v "$PWD":/work:Z -w /work mcr.microsoft.com/playwright:v1.65.1-noble npm run test:e2e:webkit -- {{.CLI_ARGS}}
  e2e:ui:
    desc: 'Build, then Playwright UI mode to run and replay each flow (e.g. E2E_MOTION=full task e2e:ui)'
    cmds:
      - task: build
      - npm run test:e2e:ui -- {{.CLI_ARGS}}
  e2e:headed:
    desc: 'Build, then watch the flows in a browser, one at a time, 300 ms per action (task e2e:headed -- --project=mobile -g "won game")'
    env:
      SLOW_MO: '{{.SLOW_MO | default "300"}}'
    cmds:
      - task: build
      - npm run test:e2e:headed -- {{.CLI_ARGS}}
  icons:
    desc: Redraw the Super 3T mark and every icon, favicon and social image made from it
    cmds: [npm run icons]
  check:
    desc: Full verification, same as CI
    cmds:
      - task: fmt-check
      - task: lint
      - task: unit
      - task: e2e
  # Releases are PRs: from an up-to-date, clean main, `npm version` (no tag) bumps package.json and
  # turns the CHANGELOG's Unreleased section into the version (scripts/changelog-release.mjs), on a
  # branch release/vX.Y.Z committed as "chore(release): vX.Y.Z" and opened as a PR. Merging it sends
  # main to pre; when the smoke test passes there, CD deploys production and creates the tag.
  release:guard:
    internal: true
    cmds:
      - test "$(git branch --show-current)" = main || (echo "Release from main only." && exit 1)
      - test -z "$(git status --porcelain)" || (echo "Working tree not clean." && exit 1)
      - git fetch -q origin main
      - test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || (echo "main is not up to date with origin." && exit 1)
  release:open:
    internal: true
    requires:
      vars: [BUMP]
    cmds:
      - task: release:guard
      - npm version {{.BUMP}} --no-git-tag-version
      - |
        version="v$(node -p "require('./package.json').version")"
        git switch -c "release/$version"
        git add package.json package-lock.json CHANGELOG.md
        git commit -m "chore(release): $version"
        git push -u origin "release/$version"
        gh pr create --base main --title "chore(release): $version" \
          --body "Release $version: the version and its CHANGELOG section. Merging sends main to pre; when the smoke test passes there, CD deploys production and tags $version."
  release:patch:
    desc: Open a release PR for a patch version (fixes)
    cmds:
      - task: release:open
        vars: { BUMP: patch }
  release:minor:
    desc: Open a release PR for a minor version (new features)
    cmds:
      - task: release:open
        vars: { BUMP: minor }
  release:major:
    desc: Open a release PR for a major version
    cmds:
      - task: release:open
        vars: { BUMP: major }
  ci:
    desc: Clean install and full verification
    cmds:
      - task: setup
      - task: check
