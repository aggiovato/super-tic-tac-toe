version: '3'

# Each entry lands with the npm script it calls.
tasks:
  setup:
    desc: Install locked dependencies
    cmds: [npm ci]
  dev:
    desc: Development server
    cmds: [npm start]
  lint:
    desc: ESLint with zero warnings
    cmds: [npm run lint]
  fmt:
    desc: Format with Prettier
    cmds: [npm run format]
  fmt-check:
    desc: Check formatting
    cmds: [npm run format:check]
  unit:
    desc: Engine (Node) and app (Angular) tests
    cmds:
      - npm run test:core
      - npm run test:app
  build:
    desc: Production build with budgets
    run: once
    cmds: [npm run build]
  serve:cf:
    desc: Build, then serve it as Cloudflare does (wrangler dev on http://localhost:8787, headers and SPA routing)
    cmds:
      - task: build
      - npm run serve:cf -- {{.CLI_ARGS}}
  e2e:
    desc: Playwright against the production build, Chromium and Firefox (needs `npx playwright install chromium firefox` once)
    cmds:
      - task: build
      - npm run test:e2e
  e2e:webkit:
    desc: Build, then the flows in WebKit inside Playwright's container (Podman; WebKit needs Ubuntu's libraries)
    cmds:
      - task: build
      - podman run --rm --ipc=host -v "$PWD":/work:Z -w /work mcr.microsoft.com/playwright:v1.65.1-noble npm run test:e2e:webkit -- {{.CLI_ARGS}}
  e2e:ui:
    desc: 'Build, then Playwright UI mode to run and replay each flow (e.g. E2E_MOTION=full task e2e:ui)'
    cmds:
      - task: build
      - npm run test:e2e:ui -- {{.CLI_ARGS}}
  e2e:headed:
    desc: 'Build, then watch the flows in a browser, one at a time, 300 ms per action (task e2e:headed -- --project=mobile -g "won game")'
    env:
      SLOW_MO: '{{.SLOW_MO | default "300"}}'
    cmds:
      - task: build
      - npm run test:e2e:headed -- {{.CLI_ARGS}}
  icons:
    desc: Redraw the Super 3T mark and every icon, favicon and social image made from it
    cmds: [npm run icons]
  check:
    desc: Full verification, same as CI
    cmds:
      - task: fmt-check
      - task: lint
      - task: unit
      - task: e2e
  # Releases: run on an up-to-date, clean main. `npm version` bumps package.json, commits
  # "chore(release): vX.Y.Z" and tags it; `git push --follow-tags` then lets CI run the whole
  # pipeline and deploy that tag to production.
  release:guard:
    internal: true
    cmds:
      - test "$(git branch --show-current)" = main || (echo "Release from main only." && exit 1)
      - test -z "$(git status --porcelain)" || (echo "Working tree not clean." && exit 1)
      - git fetch -q origin main
      - test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || (echo "main is not up to date with origin." && exit 1)
  release:patch:
    desc: Release a patch version (fixes)
    cmds:
      - task: release:guard
      - 'npm version patch -m "chore(release): v%s"'
  release:minor:
    desc: Release a minor version (new features)
    cmds:
      - task: release:guard
      - 'npm version minor -m "chore(release): v%s"'
  release:major:
    desc: Release a major version
    cmds:
      - task: release:guard
      - 'npm version major -m "chore(release): v%s"'
  ci:
    desc: Clean install and full verification
    cmds:
      - task: setup
      - task: check
